name: Build & Publish Android Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Etiqueta de versión personalizada (opcional, ej: v1.1.0)'
        required: false
        default: ''
      version_code:
        description: 'Código numérico de compilación (opcional, ej: 2)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine release version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION_TAG: ${{ github.event.inputs.version_tag }}
          INPUT_VERSION_CODE: ${{ github.event.inputs.version_code }}
          RUN_NUM: ${{ github.run_number }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_VERSION_TAG" ]; then
            RAW_TAG="$INPUT_VERSION_TAG"
          else
            RAW_TAG="v1.0.${RUN_NUM}"
          fi
          TAG="${RAW_TAG#refs/tags/}"
          if [[ ! "$TAG" =~ ^v?[0-9]+(\.[0-9]+)*$ ]]; then
            echo "Etiqueta inválida: $TAG. Usá formato como v1.1.0"
            exit 1
          fi
          CLEAN_VERSION="${TAG#v}"
          if [ -n "$INPUT_VERSION_CODE" ]; then
            if [[ ! "$INPUT_VERSION_CODE" =~ ^[0-9]+$ ]]; then
              echo "Código de versión inválido: debe ser numérico."
              exit 1
            fi
            VCODE="$INPUT_VERSION_CODE"
          else
            VCODE="$((RUN_NUM + 1))"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version_name=$CLEAN_VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VCODE" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -n "$SDK_ROOT" ] && [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi
          gradle --version

      - name: Prepare signing keystore
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > my-upload-key.jks
            echo "build_type=release" >> "$GITHUB_OUTPUT"
          else
            if [ -f "debug.keystore.base64" ]; then
              tr -d '\r\n ' < debug.keystore.base64 | base64 -d > debug.keystore
            fi
            if [ ! -s "debug.keystore" ]; then
              keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
            echo "build_type=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Android APK
        shell: bash
        env:
          BUILD_TYPE: ${{ steps.signing.outputs.build_type }}
          VERSION_TAG: ${{ steps.version.outputs.tag }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ "$BUILD_TYPE" = "release" ]; then
            gradle :app:assembleRelease --no-daemon --stacktrace \
              -PappVersionName="$VERSION_NAME" \
              -PappVersionCode="$VERSION_CODE"
            cp app/build/outputs/apk/release/app-release.apk "MalvinasProService-${VERSION_TAG}.apk"
          else
            gradle :app:assembleDebug --no-daemon --stacktrace \
              -PappVersionName="$VERSION_NAME" \
              -PappVersionCode="$VERSION_CODE"
            cp app/build/outputs/apk/debug/app-debug.apk "MalvinasProService-${VERSION_TAG}.apk"
          fi
          ls -lh "MalvinasProService-${VERSION_TAG}.apk"

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: "Malvinas Pro Service ${{ steps.version.outputs.tag }}"
          generate_release_notes: true
          make_latest: true
          files: "MalvinasProService-${{ steps.version.outputs.tag }}.apk"
