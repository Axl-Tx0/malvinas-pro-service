name: Build & Publish Android Release

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'docs/**'
      - 'GITHUB_UPDATES.md'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Etiqueta de versión personalizada (opcional, ej: v1.1.0)'
        required: false
        default: ''
      version_code:
        description: 'Código numérico de compilación (opcional, ej: 20)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine release version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION_TAG: ${{ github.event.inputs.version_tag }}
          INPUT_VERSION_CODE: ${{ github.event.inputs.version_code }}
          RUN_NUM: ${{ github.run_number }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_VERSION_TAG" ]; then
            RAW_TAG="$INPUT_VERSION_TAG"
          else
            RAW_TAG="v1.0.${RUN_NUM}"
          fi
          TAG="${RAW_TAG#refs/tags/}"
          if [[ ! "$TAG" =~ ^v?[0-9]+(\.[0-9]+)*$ ]]; then
            echo "Etiqueta inválida: $TAG. Usá formato como v1.1.0"
            exit 1
          fi
          CLEAN_VERSION="${TAG#v}"
          MIN_VCODE="$((RUN_NUM + 10))"
          if [ -n "$INPUT_VERSION_CODE" ]; then
            if [[ ! "$INPUT_VERSION_CODE" =~ ^[0-9]+$ ]]; then
              echo "Código de versión inválido: debe ser numérico."
              exit 1
            fi
            VCODE="$INPUT_VERSION_CODE"
          else
            VCODE="$MIN_VCODE"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version_name=$CLEAN_VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VCODE" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -n "$SDK_ROOT" ] && [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi
          gradle --version

      - name: Prepare consistent signing keystore (required for in-place updates)
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > my-upload-key.jks
            if [ ! -s "my-upload-key.jks" ]; then
              echo "::error::El secreto KEYSTORE_BASE64 está vacío o es inválido."
              exit 1
            fi
            echo "Usando keystore fija de producción (KEYSTORE_BASE64)."
            keytool -list -keystore my-upload-key.jks -storepass "$STORE_PASSWORD" | grep -E "Alias|SHA1|SHA-256|Fingerprint" || true
            echo "build_type=release" >> "$GITHUB_OUTPUT"
          else
            if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
              printf '%s' "$DEBUG_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > raw-debug.keystore
              echo "Usando keystore fija desde el secreto DEBUG_KEYSTORE_BASE64."
            elif [ -f "debug.keystore.base64" ] && [ -s "debug.keystore.base64" ]; then
              tr -d '\r\n ' < debug.keystore.base64 | base64 -d > raw-debug.keystore
              echo "Usando keystore fija desde debug.keystore.base64 del repositorio."
            else
              echo "::error::No se encontró la firma fija (secreto DEBUG_KEYSTORE_BASE64). Creá tu firma fija una sola vez y guardala como secreto DEBUG_KEYSTORE_BASE64 en GitHub -> Settings -> Secrets and variables -> Actions."
              exit 1
            fi
            if [ ! -s "raw-debug.keystore" ]; then
              echo "::error::No se pudo decodificar DEBUG_KEYSTORE_BASE64. Verificá que el secreto tenga el base64 completo sin texto extra."
              exit 1
            fi
            if LC_ALL=C keytool -list -keystore raw-debug.keystore -storepass android -alias androiddebugkey >/dev/null 2>&1; then
              mv raw-debug.keystore debug.keystore
            else
              SRC_ALIAS=$(LC_ALL=C keytool -list -v -keystore raw-debug.keystore -storepass android | awk -F': ' '/^Alias name:/{print $2; exit}')
              if [ -z "$SRC_ALIAS" ]; then
                echo "::error::El archivo en DEBUG_KEYSTORE_BASE64 no es un keystore/PFX válido con contraseña 'android'."
                exit 1
              fi
              rm -f debug.keystore
              LC_ALL=C keytool -importkeystore \
                -srckeystore raw-debug.keystore -srcstoretype PKCS12 -srcstorepass android -srcalias "$SRC_ALIAS" \
                -destkeystore debug.keystore -deststoretype PKCS12 -deststorepass android -destalias androiddebugkey -destkeypass android -noprompt
              rm -f raw-debug.keystore
            fi
            LC_ALL=C keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | grep -E "Alias name:|SHA1:|SHA256:" || true
            echo "build_type=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare Firebase config (google-services.json)
        shell: bash
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            if printf '%s' "$GOOGLE_SERVICES_JSON" | grep -Eq '^[[:space:]]*\{'; then
              printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            else
              printf '%s' "$GOOGLE_SERVICES_JSON" | tr -d '\r\n ' | base64 -d > app/google-services.json
            fi
            echo "app/google-services.json cargado desde el secreto GOOGLE_SERVICES_JSON."
          elif [ ! -f "app/google-services.json" ]; then
            echo "::error::Falta app/google-services.json en GitHub. Creá el secreto GOOGLE_SERVICES_JSON en Settings -> Secrets and variables -> Actions con el contenido de app/google-services.json para compilar con Firebase e inicio de sesión con Google."
            exit 1
          fi

      - name: Build Android APK
        shell: bash
        env:
          BUILD_TYPE: ${{ steps.signing.outputs.build_type }}
          VERSION_TAG: ${{ steps.version.outputs.tag }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ "$BUILD_TYPE" = "release" ]; then
            gradle :app:assembleRelease --no-daemon --stacktrace \
              -PappVersionName="$VERSION_NAME" \
              -PappVersionCode="$VERSION_CODE"
            cp app/build/outputs/apk/release/app-release.apk "MalvinasProService-${VERSION_TAG}.apk"
          else
            gradle :app:assembleDebug --no-daemon --stacktrace \
              -PappVersionName="$VERSION_NAME" \
              -PappVersionCode="$VERSION_CODE"
            cp app/build/outputs/apk/debug/app-debug.apk "MalvinasProService-${VERSION_TAG}.apk"
          fi
          ls -lh "MalvinasProService-${VERSION_TAG}.apk"

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: "Malvinas Pro Service ${{ steps.version.outputs.tag }}"
          body: |
            Actualización oficial **Malvinas Pro Service ${{ steps.version.outputs.tag }}** (Compilación `${{ steps.version.outputs.version_code }}`).

            - Se instala directamente encima de tu versión anterior **sin desinstalar** y conservando tus datos.
          generate_release_notes: true
          make_latest: true
          files: "MalvinasProService-${{ steps.version.outputs.tag }}.apk"
