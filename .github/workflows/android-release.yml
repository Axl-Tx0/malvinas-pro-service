name: Build & Publish Android Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Etiqueta de versión personalizada (opcional, ej: v1.1.0)'
        required: false
        default: ''
      version_code:
        description: 'Código numérico de compilación (opcional, ej: 2)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine release version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION_TAG: ${{ github.event.inputs.version_tag }}
          INPUT_VERSION_CODE: ${{ github.event.inputs.version_code }}
          RUN_NUM: ${{ github.run_number }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_VERSION_TAG" ]; then
            RAW_TAG="$INPUT_VERSION_TAG"
          else
            RAW_TAG="v1.0.${RUN_NUM}"
          fi
          TAG="${RAW_TAG#refs/tags/}"
          if [[ ! "$TAG" =~ ^v?[0-9]+(\.[0-9]+)*$ ]]; then
            echo "Etiqueta inválida: $TAG. Usá formato como v1.1.0"
            exit 1
          fi
          CLEAN_VERSION="${TAG#v}"
          if [ -n "$INPUT_VERSION_CODE" ]; then
            if [[ ! "$INPUT_VERSION_CODE" =~ ^[0-9]+$ ]]; then
              echo "Código de versión inválido: debe ser numérico."
              exit 1
            fi
            VCODE="$INPUT_VERSION_CODE"
          else
            VCODE="$((RUN_NUM + 1))"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version_name=$CLEAN_VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VCODE" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing keystore
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
            echo "build_type=release" >> "$GITHUB_OUTPUT"
          else
            if [ -f "debug.keystore.base64" ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
            echo "build_type=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Android APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ "${{ steps.signing.outputs.build_type }}" = "release" ]; then
            gradle :app:assembleRelease \
              -PappVersionName="${{ steps.version.outputs.version_name }}" \
              -PappVersionCode="${{ steps.version.outputs.version_code }}"
            cp app/build/outputs/apk/release/app-release.apk "MalvinasProService-${{ steps.version.outputs.tag }}.apk"
          else
            gradle :app:assembleDebug \
              -PappVersionName="${{ steps.version.outputs.version_name }}" \
              -PappVersionCode="${{ steps.version.outputs.version_code }}"
            cp app/build/outputs/apk/debug/app-debug.apk "MalvinasProService-${{ steps.version.outputs.tag }}.apk"
          fi

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Malvinas Pro Service ${{ steps.version.outputs.tag }}"
          generate_release_notes: true
          files: "MalvinasProService-${{ steps.version.outputs.tag }}.apk"
